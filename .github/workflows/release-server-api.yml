# Sandbox: enable delivery only after the npm release checks pass.
name: Release Server API Image
'on':
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable CLI tag (vX.Y.Z)
        required: true
permissions:
  contents: read
jobs:
  publish-docker:
    if: >-
      false && (github.repository == 'asyncapi-actions-test/cli' && (github.event_name == 'workflow_dispatch' ||
      (!github.event.release.draft && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v')
      && !contains(github.event.release.tag_name, '-'))))
    name: Generating Docker
    runs-on: ubuntu-latest
    steps:
      - name: Get version without v character
        id: version
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || github.event.inputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          VERSION_WITHOUT_V=${RELEASE_VERSION#v}
          echo "value=${VERSION_WITHOUT_V}" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.version }}
          persist-credentials: false
      - name: Set Up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Login to test GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: push
        with:
          context: .
          file: ./src/apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/asyncapi-actions-test/cli-release-test-20261022-api:${{ steps.version.outputs.value }}
            ghcr.io/asyncapi-actions-test/cli-release-test-20261022-api:latest
          platforms: linux/amd64,linux/arm64
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
