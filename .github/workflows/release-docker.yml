# Sandbox: enable delivery only after the npm release checks pass.
name: Release Docker Image
'on':
  release:
    types:
      - published
permissions:
  contents: read
jobs:
  publish-docker:
    if: >-
      false && (github.repository == 'asyncapi-actions-test/cli' && !github.event.release.draft &&
      !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v') &&
      !contains(github.event.release.tag_name, '-'))
    name: Generating Docker
    runs-on: ubuntu-latest
    steps:
      - name: Get version without v character
        id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          [[ "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          VERSION_WITHOUT_V=${TAG_NAME#v}
          echo "value=${VERSION_WITHOUT_V}" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Set Up QEMU
        uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb
      - name: Login to test GHCR
        uses: docker/login-action@e92390c5fb421da1463c202d546fed0ec5c39f20
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Image
        uses: docker/build-push-action@2cdde995de11925a030ce8070c3d77a52ffcf1c0
        with:
          push: true
          load: false
          build-args: |
            ASYNCAPI_CLI_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/asyncapi-actions-test/cli-release-test-20261022-cli:${{ steps.version.outputs.value }}
            ghcr.io/asyncapi-actions-test/cli-release-test-20261022-cli:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha
    permissions:
      contents: read
      packages: write
  publish-action-docker:
    if: >-
      false && (github.repository == 'asyncapi-actions-test/cli' && !github.event.release.draft &&
      !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v') &&
      !contains(github.event.release.tag_name, '-'))
    name: Release github action for cli and update version in action.yml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Get version without v character
        id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          [[ "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          VERSION_WITHOUT_V=${TAG_NAME#v}
          echo "value=${VERSION_WITHOUT_V}" >> "$GITHUB_OUTPUT"
      - name: Set Up QEMU
        uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb
      - name: Login to test GHCR
        uses: docker/login-action@e92390c5fb421da1463c202d546fed0ec5c39f20
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@2cdde995de11925a030ce8070c3d77a52ffcf1c0
        with:
          context: .
          file: ./github-action/Dockerfile
          push: true
          tags: |
            ghcr.io/asyncapi-actions-test/cli-release-test-20261022-action:${{ steps.version.outputs.value }}
            ghcr.io/asyncapi-actions-test/cli-release-test-20261022-action:latest
          platforms: linux/amd64,linux/arm64
    permissions:
      contents: read
      packages: write
